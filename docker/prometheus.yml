global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'agriflow-oracle-relayer'
    static_configs:
      - targets: ['oracle-relayer:9090']
        labels:
          network: 'stellar-testnet'
          service: 'oracle-relayer'

  - job_name: 'agriflow-node-cli'
    static_configs:
      - targets: ['oracle-validator:9100']
        labels:
          network: 'stellar-testnet'
          service: 'validator-node'
