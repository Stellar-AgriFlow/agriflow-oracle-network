name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts-test:
    name: Soroban Contracts Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.79.0
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run Contract Tests
        run: cargo test --manifest-path contracts/Cargo.toml --verbose

      - name: Build WASM Contracts
        run: cargo build --manifest-path contracts/Cargo.toml --target wasm32-unknown-unknown --release

  typescript-check:
    name: TypeScript Packages & Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Packages & Apps
        run: pnpm run build

