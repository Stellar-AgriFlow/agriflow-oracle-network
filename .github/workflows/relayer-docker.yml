name: Relayer Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'services/oracle-relayer/**'
      - 'docker/**'
      - '.github/workflows/relayer-docker.yml'

jobs:
  docker-build:
    name: Build & Verify Relayer Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.relayer
          push: false
          tags: stellar-agriflow/oracle-relayer:latest
